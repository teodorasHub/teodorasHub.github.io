<!-- Själva spel-sidan: canvas + fel-overlay för enklare felsökning -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Plant Game</title>
    <link rel="stylesheet" href="css/index.css">

    <!-- Pixel-font för hela spelet -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

    <div id="error-overlay" style="display:none; position:fixed; inset:12px; background:#111; color:#fff; padding:12px; font:12px/1.4 monospace; z-index:9999; border:2px solid #f00; white-space:pre-wrap;"></div>
    <script>
        (function () {
            const overlay = document.getElementById("error-overlay");
            const show = (msg) => {
                overlay.style.display = "block";
                overlay.textContent = msg;
            };
            window.addEventListener("error", (e) => {
                show("JS error:\\n" + (e.message || e.error));
            });
            window.addEventListener("unhandledrejection", (e) => {
                show("Unhandled promise rejection:\\n" + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
            });
        })();
    </script>

    <!-- Spelets canvas -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Startar spelets modul -->
    <script type="module" src="./js/main.js"></script>

</body>

</html>
